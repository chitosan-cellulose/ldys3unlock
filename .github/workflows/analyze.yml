name: Analyze original binaries

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Disassemble arm64e slices
        run: |
          mkdir -p out
          for f in bin/*; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            echo "=== $base : file ===" ; file "$f"
            echo "=== $base : archs ===" ; lipo -info "$f" || true
            lipo -thin arm64e "$f" -o "out/$base.arm64e" 2>/dev/null || cp "$f" "out/$base.arm64e"
            echo "=== $base : load cmds ===" ; otool -l "out/$base.arm64e" | grep -A3 -E "LC_ENCRYPTION|LC_LOAD_DYLIB|LC_ID_DYLIB|name " | head -80
            echo "=== $base : strings (verify related) ===" ; strings -a "out/$base.arm64e" | grep -iE "activ|expire|valid|login|jyyxt|116.62|verify|deposit|serial" | sort -u | head -120
            echo "=== $base : objc methods (activation/expire/serial/verify/login/deposit) ===" ; otool -ov "out/$base.arm64e" 2>/dev/null > "out/$base.arm64e.objc" ; grep -B3 -A8 -iE "getActivationCode|replyActivationCode|setActivationCode|activationCode|getExpireStatus|expireTime|expire_time|newExpireTime|serialNumber|SerialNumber|verifyKey|internalVerifyKey|_verifyKey|deposit|loginToken|loggedIn|getbp|getDeviceSerial" "out/$base.arm64e.objc" | head -400
            echo "=== $base : disasm (functions) ===" ; otool -tvV "out/$base.arm64e" > "out/$base.arm64e.asm" 2>/dev/null
            wc -l "out/$base.arm64e.asm"
            if [ "$base" = "ldysdaemon" ]; then
              echo "=== $base : FULL objc (otool -ov) ===" ; cat "out/$base.arm64e.objc"
              echo "=== $base : cstring (with addresses) ===" ; otool -v -s __TEXT __cstring "out/$base.arm64e" 2>/dev/null | head -200
              echo "=== $base : disasm refs to 116 / reply / activation ===" ; grep -nE "116|reply|ctivat|serial|Serial" "out/$base.arm64e.asm" | head -80
            fi
          done
          ls -l out
      - name: Upload analysis
        uses: actions/upload-artifact@v4
        with:
          name: analysis
          path: out/
          if-no-files-found: error
