name: Patch & sign SpringBoardService

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  patch:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ldid
        run: brew install ldid
      - name: Patch getters and re-sign
        run: |
          set -e
          mkdir -p out
          python3 - <<'PY'
          import struct, subprocess

          RET = bytes.fromhex("c0035fd6")
          # original getter instructions (verified against runtime disasm):
          LDRB_RET = bytes.fromhex("00404039") + RET   # ldrb w0,[x0,#0x10] ; ret
          LDR_RET  = bytes.fromhex("001040f9") + RET   # ldr  x0,[x0,#0x20] ; ret
          LDRW_RET = bytes.fromhex("000c40b9") + RET   # ldr  w0,[x0,#0xc]  ; ret  (connectedDeviceType)
          # replacements:
          MOV1_RET = bytes.fromhex("20008052") + RET   # mov w0,#1 ; ret
          FAR_RET  = bytes.fromhex("a054bed2") + RET   # movz x0,#0xF2A5,lsl#16 ; ret  (~year 2099)
          NOP = bytes.fromhex("1f2003d5")              # nop

          patches = {
            "arm64e": [
              (0x347894, LDRB_RET, MOV1_RET),  # login
              (0x3cf300, LDRB_RET, MOV1_RET),  # loggedIn
              (0x3cf310, LDR_RET,  FAR_RET),   # expireTime
              (0x33fe20, LDRW_RET, MOV1_RET),  # connectedDeviceType -> always connected (1)
              # --- getExpireStatus completion block: force server-verification to always SUCCEED ---
              (0x346828, bytes.fromhex("c1040054"), NOP),  # b.ne (code!=-999 -> fail)  -> nop
              (0x3468d8, bytes.fromhex("e1070054"), NOP),  # b.ne (statusCode!=200)    -> nop
              (0x34698c, bytes.fromhex("f3060034"), NOP),  # cbz w19 (boolValue false) -> nop
              # --- recharge/activation-code completion: FORCE success + always activate ---
              (0x3455a8, bytes.fromhex("b30500b4"), bytes.fromhex("2d000014")),  # cbz -> b (always success branch)
              (0x3456d0, bytes.fromhex("89020054"), NOP),                        # b.ls (expired? return) -> nop
            ],
            "arm64": [
              (0x33f3f0, LDRB_RET, MOV1_RET),  # login
              (0x3c3554, LDRB_RET, MOV1_RET),  # loggedIn
              (0x3c3564, LDR_RET,  FAR_RET),   # expireTime
              (0x337d0c, LDRW_RET, MOV1_RET),  # connectedDeviceType -> always connected (1)
              # --- getExpireStatus completion block: force server-verification to always SUCCEED ---
              (0x33e40c, bytes.fromhex("a1040054"), NOP),  # b.ne (code!=-999 -> fail)  -> nop
              (0x33e4b8, bytes.fromhex("81070054"), NOP),  # b.ne (statusCode!=200)    -> nop
              (0x33e564, bytes.fromhex("b3060034"), NOP),  # cbz w19 (boolValue false) -> nop
              # --- recharge/activation-code completion: FORCE success + always activate ---
              (0x33d208, bytes.fromhex("b30500b4"), bytes.fromhex("2d000014")),  # cbz -> b (always success branch)
              (0x33d330, bytes.fromhex("69020054"), NOP),                        # b.ls (expired? return) -> nop
            ],
          }

          def text_seg(path):
              with open(path,"rb") as f:
                  magic = struct.unpack_from("<I", f.read(4))[0]
                  assert magic in (0xfeedfacf, 0xfeedface), hex(magic)
                  is64 = magic == 0xfeedfacf
                  f.seek(16)
                  ncmds = struct.unpack_from("<I", f.read(4))[0]
                  off = 32 if is64 else 28
                  for _ in range(ncmds):
                      f.seek(off)
                      cmd, cmdsize = struct.unpack_from("<II", f.read(8))
                      if (is64 and cmd == 0x19) or ((not is64) and cmd == 0x1):
                          name = f.read(16).rstrip(b"\x00")
                          if is64:
                              vmaddr, vsize, fileoff, filesize = struct.unpack_from("<QQQQ", f.read(32))
                          else:
                              vmaddr, vsize, fileoff, filesize = struct.unpack_from("<IIII", f.read(16))
                          if name == b"__TEXT":
                              return vmaddr, fileoff
                      off += cmdsize
              raise RuntimeError("__TEXT not found")

          for arch, plist in patches.items():
              src = f"out/sbs.{arch}"
              subprocess.run(["lipo","-thin",arch,"bin/SpringBoardService.dylib","-o",src], check=True)
              vmaddr, fileoff = text_seg(src)
              delta = fileoff - vmaddr   # file offset = vm + delta
              print(f"[{arch}] __TEXT vmaddr=0x{vmaddr:x} fileoff=0x{fileoff:x} delta=0x{delta:x}")
              with open(src,"rb") as f: data=bytearray(f.read())
              for vm, exp, rep in plist:
                  off = vm + delta
                  cur = bytes(data[off:off+len(exp)])
                  print(f"[{arch}] vm=0x{vm:x} fileoff=0x{off:x} orig={cur.hex()} expect={exp.hex()} match={cur==exp}")
                  assert cur==exp, f"byte mismatch at vm=0x{vm:x} fileoff=0x{off:x}: {cur.hex()} != {exp.hex()}"
                  data[off:off+len(rep)] = rep
              with open(src,"wb") as f: f.write(data)
              print(f"[{arch}] patched {src}")
          PY
          # re-sign each thin slice
          for arch in arm64 arm64e; do
            ldid -S "out/sbs.$arch"
            echo "signed out/sbs.$arch"
          done
          # rebuild fat binary
          lipo -create -output out/SpringBoardService.dylib out/sbs.arm64 out/sbs.arm64e
          ldid -S out/SpringBoardService.dylib
          file out/SpringBoardService.dylib
          lipo -info out/SpringBoardService.dylib
          ls -l out
      - name: Upload patched binaries
        uses: actions/upload-artifact@v4
        with:
          name: patched
          path: out/SpringBoardService.dylib
          if-no-files-found: error
