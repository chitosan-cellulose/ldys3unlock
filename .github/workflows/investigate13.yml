name: Analyze ldysdaemon auth + BackboardService reply logic (read-only)

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check binaries present
        run: |
          echo "== bin/ contents =="
          ls -l bin/ 2>/dev/null || echo "NO bin/ folder"
          for f in ldysdaemon BackboardService.dylib SpringBoardService.dylib; do
            if [ -f "bin/$f" ]; then
              echo "HAVE bin/$f : $(ls -l bin/$f | awk '{print $5}') bytes"
              lipo -info "bin/$f" 2>/dev/null || true
            else
              echo "MISSING bin/$f"
            fi
          done
        shell: bash

      - name: Write analysis script
        run: |
          cat > analyze.py <<'PYEOF'
          import struct, os, re, sys

          def load_slice(path):
              # try arm64e, then arm64, then whole file
              base = os.path.basename(path)
              for arch in ("arm64e", "arm64"):
                  out = "out/%s.%s" % (base, arch)
                  if os.path.exists(out):
                      return open(out, "rb").read(), out
              return open(path, "rb").read(), path

          def strings_with_offset(blob, minlen=5):
              res = []
              cur = bytearray(); start = 0
              for i, b in enumerate(blob):
                  if 32 <= b < 127:
                      if not cur: start = i
                      cur.append(b)
                  else:
                      if len(cur) >= minlen:
                          res.append((start, cur.decode('ascii', 'replace')))
                      cur = bytearray()
              if len(cur) >= minlen:
                  res.append((start, cur.decode('ascii', 'replace')))
              return res

          def u32(blob, o):
              return struct.unpack_from("<I", blob, o)[0]

          def adrp_target(pc, ins):
              if (ins & 0x9f000000) != 0x90000000:
                  return None
              immlo = (ins >> 29) & 3
              immhi = (ins >> 5) & 0x7ffff
              imm = (immhi << 2) | immlo
              if imm & (1 << 20):
                  imm -= (1 << 21)
              return (pc & ~0xfff) + (imm << 12)

          def find_xrefs(blob, soff_map):
              n = len(blob) // 4
              xrefs = {k: [] for k in soff_map}
              for i in range(n - 1):
                  pc = i * 4
                  t = adrp_target(pc, u32(blob, pc))
                  if t is None:
                      continue
                  rd = u32(blob, pc) & 31
                  for j in range(i + 1, min(i + 5, n)):
                      w = u32(blob, j * 4)
                      if (w & 0xffc00000) == 0x91000000 and (w & 31) == rd and ((w >> 5) & 31) == rd:
                          addr = t + (((w >> 10) & 0xfff) << (12 if (w >> 22) & 1 else 0))
                          for sname, soffv in soff_map.items():
                              if addr == soffv:
                                  xrefs[sname].append(pc)
                          break
              return xrefs

          TARGETS = [b'http://116.62.39.79:1203/f', b'replyActivationCode', b'getActivationCode',
                     b'setActivationCode', b'pongDaemon', b'replyServerName', b'statusCode']
          KW = re.compile(r'116\.|/f$|Activation|activation|expire|statusCode|reply|pong|ServerName|xpc|hid|serial|Serial|valid|author|license|connect|device|register|token|login|expired')

          for f in ["ldysdaemon", "BackboardService.dylib"]:
              path = "bin/%s" % f
              if not os.path.exists(path):
                  print("MISSING %s" % f)
                  continue
              print("\n########## %s ##########" % f)
              blob, src = load_slice(path)
              print("slice src:", src, "size:", len(blob))
              res = strings_with_offset(blob, 5)
              with open("out/%s.strings.txt" % f, "w") as o:
                  for off, s in res:
                      o.write("0x%x\t%s\n" % (off, s))
              print("--- interesting strings (offset : string) ---")
              seen = set()
              for off, s in res:
                  if KW.search(s) and s not in seen:
                      seen.add(s)
                      print("0x%x\t%s" % (off, s))
              soff = {}
              for t in TARGETS:
                  i = blob.find(t)
                  if i >= 0:
                      soff[t.decode()] = i
              print("\n--- target string offsets ---")
              for k, v in soff.items():
                  print("  %r @ 0x%x" % (k, v))
              xrefs = find_xrefs(blob, soff)
              print("--- xrefs (code that loads each string) ---")
              for sname, locs in xrefs.items():
                  print("  %r : %s" % (sname, [hex(x) for x in locs]))
              allpc = sorted(set(sum(xrefs.values(), [])))
              for pc in allpc:
                  lo = max(0, pc - 0x50)
                  hi = min(len(blob), pc + 0xf0)
                  print("\n---- raw bytes 0x%x .. 0x%x (xref at 0x%x) ----" % (lo, hi, pc))
                  for o in range(lo, hi, 16):
                      chunk = blob[o:o + 16]
                      print("0x%06x  %s" % (o, " ".join("%02x" % b for b in chunk)))
          PYEOF
          echo "script written, lines: $(wc -l < analyze.py)"
        shell: bash

      - name: Thin slices and run analysis
        run: |
          set -e
          mkdir -p out
          for f in ldysdaemon BackboardService.dylib; do
            [ -f "bin/$f" ] || continue
            lipo -thin arm64e "bin/$f" -output "out/${f}.arm64e" 2>/dev/null && echo "$f arm64e thin ok" || echo "$f no arm64e"
            lipo -thin arm64 "bin/$f" -output "out/${f}.arm64" 2>/dev/null && echo "$f arm64 thin ok" || echo "$f no arm64"
          done
          python3 analyze.py
        shell: bash

      - name: otool objc + disasm grep (ldysdaemon)
        run: |
          [ -f bin/ldysdaemon ] || { echo "no ldysdaemon"; exit 0; }
          P="out/ldysdaemon.arm64e"
          [ -f "$P" ] || P="out/ldysdaemon.arm64"
          [ -f "$P" ] || P="bin/ldysdaemon"
          echo "disasm file: $P"
          echo "== objc methods (otool -ov) =="
          otool -ov "bin/ldysdaemon" 2>/dev/null | grep -iE 'name 0x|reply|pong|activation|expire|server|hid|status|serial|device' | head -120 || true
          echo "== full disasm grep =="
          otool -tV "$P" 2>/dev/null > out/ldysdaemon.full.asm || true
          wc -l out/ldysdaemon.full.asm
          grep -nE '116\.62|replyActivation|getActivation|setActivation|pongDaemon|replyServer|statusCode|NSJSON|dataTask|completionHandler|b\.(ne|eq|lt|gt|le|ge|hs|lo|hi)|cbz|cbnz|cmp ' out/ldysdaemon.full.asm | head -200 || true
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: investigate13
          path: out/
