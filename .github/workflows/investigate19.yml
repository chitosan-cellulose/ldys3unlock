name: Xref status strings in SpringBoardService arm64e

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Thin arm64e
        run: |
          mkdir -p out
          lipo -thin arm64e bin/SpringBoardService.dylib -output out/sbs.arm64e 2>/dev/null || cp bin/SpringBoardService.dylib out/sbs.arm64e
          lipo -info out/sbs.arm64e
        shell: bash
      - name: Locate strings + find code xrefs
        run: |
          cat > xr.py <<'PYEOF'
          import struct
          d=open("out/sbs.arm64e","rb").read()
          off=0x20; ncmds=struct.unpack_from("<I",d,16)[0]; sects={}
          for _ in range(ncmds):
              cmd,sz=struct.unpack_from("<II",d,off)
              if cmd==0x19:
                  n=struct.unpack_from("<I",d,off+64)[0]; so=off+72
                  for _ in range(n):
                      nm=d[so:so+16].split(b'\0')[0].decode()
                      a=struct.unpack_from("<Q",d,so+32)[0]; s=struct.unpack_from("<Q",d,so+40)[0]
                      f=struct.unpack_from("<I",d,so+48)[0]; sects[nm]=(a,s,f); so+=80
              off+=sz
          u32=lambda o: struct.unpack_from("<I",d,o)[0]
          BASE=0x100000000                       # VM = fileoff + BASE for these slices
          targets=["无法获取用户状态。用户已过期或无法连接服务器","无法启动映射。因为用户已过期","未连接。可能用户已过期或其他错误"]
          t_a,t_sz,t_fo=sects["__text"]
          tfo=t_fo; tsz=t_sz; ta=tfo+BASE        # __text VM base
          print("__text foff=0x%x size=0x%x -> ta=0x%x"%(tfo,tsz,ta))
          out=open("out/xrefs.txt","w")
          for ts in targets:
              i=d.find(ts.encode("utf-16-le"))
              if i<0: i=d.find(ts.encode("utf-8"))
              vm=i+BASE
              print("STR %r fileoff=0x%x VM=0x%x"%(ts[:12],i,vm))
              # find cfstring struct whose strptr (chained-encoded) points to this string
              cf_vm=None
              for q in range(0,len(d)-8,8):
                  raw=struct.unpack_from("<Q",d,q)[0]
                  if (raw & 0xFFFFFFFFF)==vm:
                      cf_vm=(q-16)+BASE; print("  cfstruct strptr@fileoff 0x%x -> cfstruct VM 0x%x"%(q,cf_vm)); break
              targets_vm=[vm]
              if cf_vm: targets_vm.append(cf_vm)
              hits=[]
              for S in targets_vm:
                for o in range(tfo,tfo+tsz,4):
                  ins=u32(o); pc=ta+(o-tfo)
                  if (ins & 0x9F000000)==0x10000000:  # adr
                      immlo=(ins>>29)&3; immhi=(ins>>5)&0x7FFFF; imm=(immhi<<2)|immlo
                      if imm&(1<<20): imm-=(1<<21)
                      if pc+imm==S: hits.append(("adr",S,pc))
                  if (ins & 0x9F000000)==0x90000000:  # adrp
                      immlo=(ins>>29)&3; immhi=(ins>>5)&0x7FFFF; imm=(immhi<<2)|immlo
                      if imm&(1<<20): imm-=(1<<21)
                      page=((pc & ~0xFFF)+(imm<<12)) & 0xFFFFFFFFFFFF
                      rt=ins&0x1F
                      for k in range(1,8):
                          ins2=u32(o+4*k)
                          # adrp + add  -> direct address of S
                          if (ins2&0xFFC00000)==0x91000000 and (ins2&0x1F)==rt and ((ins2>>5)&0x1F)==rt:
                              lo12=(ins2>>10)&0xFFF; sh=(ins2>>22)&1
                              if (page+(lo12<<(12 if sh else 0)))==S: hits.append(("adrp+add",S,pc)); break
                          # adrp + ldr xT,[xT,#imm12]  -> load pointer from data slot; check slot contents
                          if (ins2&0xFFC00000)==0xF9400000 and (ins2&0x1F)==rt and ((ins2>>5)&0x1F)==rt:
                              imm12=(ins2>>10)&0xFFF
                              slot=(page+imm12*8)&0xFFFFFFFFFFFF
                              fo=slot-BASE
                              if 0<=fo<=len(d)-8:
                                  val=struct.unpack_from("<Q",d,fo)[0]
                                  if (val&0xFFFFFFFFF)==S: hits.append(("adrp+ldr",S,pc)); break
              print("  xrefs:",hits)
              for ty,tgt,pc in hits: out.write("%s\t0x%x\t0x%x\n"%(ts[:12],tgt,pc))
          out.close()
          print("done")
          PYEOF
          python3 xr.py
          echo "---- xrefs.txt ----"; cat out/xrefs.txt
        shell: bash
      - name: Disasm window around each xref
        run: |
          while IFS=$'\t' read -r name svm pc; do
            [ -z "$pc" ] && continue
            s=$((pc-0x60)); e=$((pc+0x80))
            echo "############ $name  stringVM=$svm xref=$pc ############"
            objdump -d --start-address=$(printf 0x%x $s) --stop-address=$(printf 0x%x $e) out/sbs.arm64e 2>/dev/null
          done < out/xrefs.txt
        shell: bash
      - uses: actions/upload-artifact@v4
        with: { name: investigate19, path: out/ }
