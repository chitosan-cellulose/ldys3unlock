name: Patch SBS final (recharge force-success + mapping 4 gates)

on:
  workflow_dispatch
jobs:
  patch:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install ldid
      - name: Assert + patch all gates (arm64e slice) then sign
        run: |
          set -e
          F=bin/SpringBoardService.dylib
          # arm64e FAT base = 0x6b8000 ; base-0 dylib => FAT off = 0x6b8000 + VM
          # --- recharge handler: 0x3455a8 cbz x19,0x34565c -> b 0x34565c (force success) ---
          #   FAT 0x9fd5a8  orig b3 05 00 b4   new 2d 00 00 14
          # --- mapping auth gates (NOP) ---
          #   A 0x3aa184 -> fat 0xa62184  orig 33 12 00 b4
          #   B 0x3aa188 -> fat 0xa62188  orig 94 16 00 b4
          #   C 0x3aa6e0 -> fat 0xa626e0  orig 61 1f 00 54
          #   D 0x3aa788 -> fat 0xa62788  orig b5 1e 00 34
          NOP="1f2003d5"
          for spec in \
            "9fd5a8:b30500b4:2d000014" \
            "a62184:331200b4:$NOP" \
            "a62188:941600b4:$NOP" \
            "a626e0:611f0054:$NOP" \
            "a62788:b51e0034:$NOP" ; do
            off="${spec%%:*}"; rest="${spec#*:}"; exp="${rest%%:*}"; new="${rest##*:}"
            got=$(xxd -s 0x$off -l 4 -p $F)
            echo "0x$off: got=$got expect=$exp"
            test "$got" = "$exp" || { echo "ASSERT FAIL 0x$off"; exit 1; }
            printf "$(echo $new | sed 's/../\\x&/g')" | dd of=$F bs=1 seek=$((0x$off)) conv=notrunc 2>/dev/null
          done
          echo "== verify =="
          for off in 9fd5a8 a62184 a62188 a626e0 a62788; do echo -n "0x$off: "; xxd -s 0x$off -l 4 -p $F; done
        shell: bash
      - name: Re-sign
        run: ldid -S bin/SpringBoardService.dylib
      - uses: actions/upload-artifact@v4
        with: { name: sbs_final, path: bin/SpringBoardService.dylib }
