name: Disasm success handler + find failure refs

on:
  workflow_dispatch:
jobs:
  scan:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p out
          lipo -thin arm64e bin/SpringBoardService.dylib -output out/sbs.arm64e 2>/dev/null || cp bin/SpringBoardService.dylib out/sbs.arm64e
          objdump -d out/sbs.arm64e > out/full.asm 2>/dev/null
        shell: bash
      - name: A success handler body
        run: |
          echo "###### 0x3aa680 - 0x3aa960 ######"
          objdump -d --start-address=0x3aa680 --stop-address=0x3aa960 out/sbs.arm64e 2>/dev/null
        shell: bash
      - name: B block-literal loads (toast blocks)
        run: |
          echo "###### grep 5ade (block literal page 0x5adxxx) ######"
          grep -nE "5ade[0-9a-f]{2}|0x5ade" out/full.asm | head -40
        shell: bash
      - name: C what is 0x49b540
        run: |
          echo "###### around 0x49b540 ######"
          objdump -d --start-address=0x49b520 --stop-address=0x49b580 out/sbs.arm64e 2>/dev/null
        shell: bash
      - uses: actions/upload-artifact@v4
        with: { name: investigate28, path: out/full.asm }
