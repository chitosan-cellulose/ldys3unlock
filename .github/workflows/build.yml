name: Build ldys3unlock deb

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install ldid dpkg

      - name: Build dylib (arm64 + arm64e, no substrate)
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang -x objective-c -fobjc-arc -shared -O2 \
            -target arm64-apple-ios14.0 -isysroot "$SDK" \
            Tweak.xm -o arm64.dylib -framework Foundation
          xcrun --sdk iphoneos clang -x objective-c -fobjc-arc -shared -O2 \
            -target arm64e-apple-ios14.0 -isysroot "$SDK" \
            Tweak.xm -o arm64e.dylib -framework Foundation
          lipo -create arm64.dylib arm64e.dylib -output ldys3unlock.dylib
          ldid -S ldys3unlock.dylib
          echo "--- deps ---"; otool -L ldys3unlock.dylib

      - name: Package deb
        run: |
          rm -rf pkg
          mkdir -p pkg/Library/MobileSubstrate/DynamicLibraries pkg/DEBIAN
          cp ldys3unlock.dylib pkg/Library/MobileSubstrate/DynamicLibraries/
          cp ldys3unlock.plist pkg/Library/MobileSubstrate/DynamicLibraries/
          cp control pkg/DEBIAN/control
          chmod 0755 pkg/DEBIAN
          dpkg-deb -b pkg com.zjx.ldys3.unlock.deb

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: ldys3unlock-deb
          path: "*.deb"
          if-no-files-found: error

