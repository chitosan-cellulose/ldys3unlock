name: Disasm mapping gating function (annotated)

on:
  workflow_dispatch:
jobs:
  scan:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p out
          lipo -thin arm64e bin/SpringBoardService.dylib -output out/sbs.arm64e 2>/dev/null || cp bin/SpringBoardService.dylib out/sbs.arm64e
        shell: bash
      - name: objdump mapping function with annotations
        run: |
          echo "###### 0x3aa580 - 0x3aad00 ######"
          objdump -d --start-address=0x3aa580 --stop-address=0x3aad00 out/sbs.arm64e 2>/dev/null
        shell: bash
      - uses: actions/upload-artifact@v4
        with: { name: investigate20, path: out/ }
