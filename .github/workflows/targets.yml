name: Analyze patch targets

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  targets:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Disassemble target methods (both arches)
        run: |
          mkdir -p out
          for arch in arm64 arm64e; do
            lipo -thin "$arch" bin/SpringBoardService.dylib -o "out/sbs.$arch" 2>/dev/null || cp bin/SpringBoardService.dylib "out/sbs.$arch"
            otool -ov "out/sbs.$arch" > "out/sbs.$arch.objc" 2>/dev/null
            otool -tvV "out/sbs.$arch" > "out/sbs.$arch.asm" 2>/dev/null
            echo "########## SpringBoardService $arch ##########"
            echo "----- raw method blocks (name+imp) -----"
            grep -B1 -A2 -E "getExpireStatusWithCompletionHandler:| (login|loggedIn|expireTime|expireTimeString|activationCode|setActivationCode:|setLogin:|setExpireTimeString:)\$" "out/sbs.$arch.objc" | head -120
            echo "----- disasm of each target -----"
            for sel in "getExpireStatusWithCompletionHandler:" "expireTimeString" "activationCode" "login"; do
              imp=$(awk -v sel="$sel" '$1=="name" && $NF==sel {f=1} f && $1=="imp" {print $2; exit}' "out/sbs.$arch.objc")
              hx=${imp#0x}
              echo "===== [$arch] $sel  imp=$imp ====="
              [ -n "$hx" ] && grep -A45 -m1 "$hx	" "out/sbs.$arch.asm" | head -48
            done
            for sel in "loggedIn" "expireTime"; do
              imp=$(awk -v sel="$sel" '$1=="name" && $NF==sel {f=1} f && $1=="imp" {print $2; exit}' "out/sbs.$arch.objc")
              hx=${imp#0x}
              echo "===== [$arch] $sel  imp=$imp ====="
              [ -n "$hx" ] && grep -A45 -m1 "$hx	" "out/sbs.$arch.asm" | head -48
            done
          done
          ls -l out
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: targets
          path: out/
          if-no-files-found: error    
