name: Analyze patch targets

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  targets:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Disassemble target methods (both arches)
        run: |
          set -e
          mkdir -p out
          for arch in arm64 arm64e; do
            lipo -thin "$arch" bin/SpringBoardService.dylib -o "out/sbs.$arch" 2>/dev/null || cp bin/SpringBoardService.dylib "out/sbs.$arch"
            otool -ov "out/sbs.$arch" > "out/sbs.$arch.objc" 2>/dev/null
            otool -tvV "out/sbs.$arch" > "out/sbs.$arch.asm" 2>/dev/null
            echo "########## SpringBoardService $arch ##########"
            for sel in "getExpireStatusWithCompletionHandler:" "setExpireTimeString:" "expireTimeString" "setActivationCode:" "activationCode" "setLogin:" "login" "setUserType:" "setUsername:"; do
              imp=$(grep -A1 "name.* ${sel}\$" "out/sbs.$arch.objc" | grep -m1 imp | awk '{print $2}')
              if [ -z "$imp" ]; then
                # try match as the whole method name line
                imp=$(grep -B0 -A1 "name.*${sel}" "out/sbs.$arch.objc" | grep -m1 imp | awk '{print $2}')
              fi
              echo "===== $sel  imp=$imp ====="
              if [ -n "$imp" ]; then
                grep -A45 "^${imp}	" "out/sbs.$arch.asm" | head -48
              fi
            done
            # second class getters: loggedIn / expireTime
            echo "===== loggedIn / expireTime getters ====="
            grep -A1 -E "name.* (loggedIn|expireTime)\$" "out/sbs.$arch.objc" | grep imp
          done
          ls -l out
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: targets
          path: out/
          if-no-files-found: error
